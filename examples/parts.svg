  <path id="bracket" d="M 100 50 L 140 50 A 10 10 0 0 1 150 60 L 150 80 C 150 95 135 100 120 95 Q 105 90 100 80 Z M 115 62 A 4 4 0 1 0 123 62 A 4 4 0 1 0 115 62 Z"/>
