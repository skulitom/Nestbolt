<svg xmlns="http://www.w3.org/2000/svg" width="200mm" height="120mm" viewBox="0 0 200 120">
  <!-- Rounded corners (arcs), a circle, an ellipse, Béziers and an elliptical arc,
       and a rotated frame with a rectangular hole: SVG user units are millimetres. -->
  <rect id="rounded" x="5" y="5" width="60" height="40" rx="8"/>
  <circle id="disc" cx="100" cy="25" r="18"/>
  <ellipse id="oval" cx="160" cy="25" rx="30" ry="15"/>
  <path id="bezier" d="M 10 70 C 30 50 60 50 80 70 Q 90 90 70 110 L 30 110 A 25 20 0 0 1 10 70 Z"/>
  <g transform="translate(110 60) rotate(15)">
    <path id="frame" d="M 0 0 h 60 v 40 h -60 z M 15 10 h 30 v 20 h -30 z"/>
  </g>
</svg>
