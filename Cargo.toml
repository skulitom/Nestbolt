[workspace]
members = ["crates/core", "crates/cli", "crates/wasm", "crates/mcp", "crates/validator"]
exclude = [".cache/upstream/sparrow", ".cache/upstream/sparrow-published", ".cache/upstream/jagua-rs"]
default-members = ["crates/core", "crates/cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.6", features = ["derive"] }
clipper2-rust = "=1.2.0"
jagua-rs = { version = "=1.1.0", features = ["bpp", "spp"] }
nestbolt-core = { path = "crates/core" }
nestbolt-validator = { path = "crates/validator" }
proptest = "1.9"
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
schemars = { version = "=1.2.2", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.48", features = ["macros", "rt", "io-std"] }
wasm-bindgen = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
