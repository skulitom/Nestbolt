[package]
name = "nestbolt-sparrow-benchmark"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[dependencies]
anyhow = "1.0"
jagua-rs = { version = "=1.1.0", features = ["spp"] }
rand = "0.10"
serde_json = "1.0"
sparrow = { git = "https://github.com/JeroenGar/sparrow.git", rev = "4629b22795ae6b25b3b460ccde6fb36a71292b6d", features = ["only_final_svg"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
