[package]
name = "nestbolt-core"
description = "Geometry adapter and future fixed-sheet optimiser for Nestbolt"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0"
clipper2-rust = "=1.2.0"
encoding_rs = "=0.8.35"
roxmltree = "0.21"
schemars = { version = "=1.2.2", features = ["derive"] }
svgtypes = "0.16"
jagua-rs = { version = "=1.1.0", features = ["bpp", "spp"] }
nestbolt-validator = { path = "C:/DEV/Nestbolt/crates/validator" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.10"
rand_distr = "0.6"
slotmap = "1.1"
sparrow = { git = "https://github.com/JeroenGar/sparrow.git", rev = "4629b22795ae6b25b3b460ccde6fb36a71292b6d", features = ["only_final_svg"] }

[dev-dependencies]
proptest = "1.9"

[lints]
rust.unsafe_code = "forbid"
clippy.all = "warn"
