[package]
name = "nestbolt-core"
description = "Fixed-sheet 2D nesting engine, SVG/DXF/LightBurn interchange, remnant extraction and cutting quotes"
repository = "https://github.com/skulitom/Nestbolt"
homepage = "https://skulitom.github.io/Nestbolt/"
keywords = ["nesting", "cad", "dxf", "svg", "laser-cutting"]
categories = ["algorithms", "graphics", "mathematics"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["search"]
search = ["dep:jagua-rs", "dep:rand", "dep:rand_distr", "dep:slotmap", "dep:sparrow"]

[dependencies]
anyhow.workspace = true
clipper2-rust.workspace = true
encoding_rs.workspace = true
roxmltree.workspace = true
schemars.workspace = true
svgtypes.workspace = true
jagua-rs = { workspace = true, optional = true }
nestbolt-validator.workspace = true
serde.workspace = true
serde_json.workspace = true
rand = { workspace = true, optional = true }
rand_distr = { workspace = true, optional = true }
slotmap = { workspace = true, optional = true }
sparrow = { workspace = true, optional = true }

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

